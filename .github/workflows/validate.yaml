name: Validate example
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15'
      - run: pip install 'stacksmith @ git+https://github.com/ci-sourcerer/stacksmith@d9f516984f5fffc388d31c0950a41b521602dec2'
      - run: stacksmith validate --runfile common/stacksmith.yaml --runfile environments/dev.yaml
      - run: stacksmith validate --runfile common/stacksmith.yaml --runfile environments/prod.yaml
